services:
  database:
    image: mysql:8.4
    container_name: payflow-database
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: payflow
      MYSQL_USER: payflow_user
      MYSQL_PASSWORD: payflow_password
      MYSQL_ROOT_PASSWORD: root_password

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -proot_password",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    build:
      context: ./server

    container_name: payflow-server

    restart: unless-stopped

    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: mysql://payflow_user:payflow_password@database:3306/payflow
      JWT_SECRET: development_only_jwt_secret_change_in_production_123456
      JWT_EXPIRES_IN: 1d

    ports:
      - "5000:5000"

    depends_on:
      database:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api

    container_name: payflow-client

    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - server

volumes:
  mysql_data: